spring:
  application:
    name: search-dev
  jackson:
    property-naming-strategy: SNAKE_CASE
  r2dbc:
    url: ${R2DBC_URL}
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
  elasticsearch:
    uris: ${ELASTICSEARCH_HOST}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      ack-mode: record
      missing-topics-fatal: false
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "kr.magicbox.search.adapter.in.kafka.event"
        spring.json.type.mapping: creator-certification-approved:kr.magicbox.search.adapter.in.kafka.event.CreatorCertificationApprovedEvent,creator-profile-updated:kr.magicbox.search.adapter.in.kafka.event.CreatorProfileUpdatedEvent,creator-revoked:kr.magicbox.search.adapter.in.kafka.event.CreatorRevokedEvent,general-goods-created:kr.magicbox.search.adapter.in.kafka.event.GeneralGoodsCreatedEvent,general-goods-updated:kr.magicbox.search.adapter.in.kafka.event.GeneralGoodsUpdatedEvent,general-goods-deleted:kr.magicbox.search.adapter.in.kafka.event.GeneralGoodsDeletedEvent,release-created:kr.magicbox.search.adapter.in.kafka.event.ReleaseCreatedEvent,release-updated:kr.magicbox.search.adapter.in.kafka.event.ReleaseUpdatedEvent,release-deleted:kr.magicbox.search.adapter.in.kafka.event.ReleaseDeletedEvent
    retry:
      topic:
        backoff:
          multiplier: 2
          delay: 1s
        attempts: 5

inbox:
  max-event-age-minutes: 5

server:
  port: ${SERVER_PORT}

security:
  trusted:
    ips:
      - ${TRUSTED_IP_GATEWAY}
